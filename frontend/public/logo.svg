<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Radial background gradient matching TaxiPay blue -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#0191E2" />
      <stop offset="100%" stop-color="#074088" />
    </radialGradient>

    <!-- Subtle drop shadow for the central 't' -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <!-- 3D inner shine for the white 't' -->
    <linearGradient id="tGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
  </defs>

  <!-- Circular background frame -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="#FFFFFF" stroke-width="8" stroke-opacity="0.2" />

  <!-- Perfectly centered 't' logo mark -->
  <g filter="url(#dropShadow)">
    <path 
      d="M171 166 H221 V111 C221 102.7 227.7 96 236 96 H266 C274.3 96 281 102.7 281 111 V166 H316 C324.3 166 331 172.7 331 181 V211 C331 219.3 324.3 226 316 226 H281 V316 C281 344 293 356 316 356 H326 C334.3 356 341 362.7 341 371 V401 C341 409.3 334.3 416 326 416 C276 416 221 401 221 326 V226 H171 C162.7 226 156 219.3 156 211 V181 C156 172.7 162.7 166 171 166 Z" 
      fill="url(#tGrad)" 
    />
  </g>
</svg>
